aid: circuitlab
name: CircuitLab
description: >-
  CircuitLab, Inc. is an in-browser schematic capture and circuit simulation
  platform that lets engineers, students, educators, and hobbyists design and
  analyze analog and digital electronics systems before building a physical
  prototype. Running entirely in the browser with no installation, it offers
  schematic capture, mixed-signal SPICE-style simulation (DC, AC, transient,
  frequency-domain), custom device models and symbols, expression-based
  parameters, and shareable, exportable documentation. CircuitLab also publishes
  an electronics curriculum (CircuitLab Academy, the Ultimate Electronics
  textbook), community forums, and an electronics Q&A. It was surfaced as a
  portfolio company of a16z and Y Combinator. At the time of this enrichment
  pass CircuitLab publishes no public developer API, SDKs, or machine-readable
  API description, so this profile captures its public web identity only.
